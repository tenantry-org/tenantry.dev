name: Bug report
description: Report a problem.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a bug or problem with the Tenantry website.

        Remember to remove sensitive information from screenshots, videos, or code samples before submitting.

        **Do not create issues for potential security vulnerabilities.** Please report them privately via [GitHub Security Advisories](https://github.com/tenantry-org/tenantry.dev/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug in a sentence or two, with screenshots or a video if they help.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce it.
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: Tell us what should happen when you encounter this bug.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Copy and paste any relevant logs. This is automatically formatted into code, so no need for backticks.
      render: shell
