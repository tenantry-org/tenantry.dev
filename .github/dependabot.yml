version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'UTC'
    # Wait a week after a release before proposing it, as Core and Pro do: a compromised version is usually pulled
    # within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-patch-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      major-dependencies:
        patterns:
          - '*'
        update-types:
          - 'major'
    labels:
      - 'dependencies'

  # The workflows' actions, including those pinned to a commit SHA, which nothing else updates.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'UTC'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
