name: audit

# Fails when an installed package (dependencies and dev dependencies, from pnpm-lock.yaml) has a known high or
# critical vulnerability; moderate and low ones are listed but do not fail it. Dependabot's alerts cover the same
# lockfile; this check also fails the change that brings a vulnerable version in. Weekly as well as on changes,
# because advisories are published for versions already installed. An advisory with no fixed version, in a package
# that only a development tool uses, is listed in package.json's pnpm.auditConfig.ignoreGhsas with the reason here:
# GHSA-vfj7-8cjw-p6xm, braces (stack exhaustion on deeply nested patterns), reached only through eslint-config-next's
# fast-glob and micromatch; nothing in the site's build output uses it, and braces has no release that fixes it.
on:
  push:
    branches: [master, staging]
  pull_request:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # Reads the lockfile only; nothing is installed or run.
      - run: pnpm audit --audit-level high
