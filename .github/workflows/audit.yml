name: audit

# Fails when an installed package (dependencies and dev dependencies, from pnpm-lock.yaml) has a known high or
# critical vulnerability; moderate and low ones are listed but do not fail it. Dependabot's alerts cover the same
# lockfile; this check also fails the change that brings a vulnerable version in. Weekly as well as on changes,
# because advisories are published for versions already installed.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # Reads the lockfile only; nothing is installed or run.
      - run: pnpm audit --audit-level high
