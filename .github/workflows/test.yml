name: test

# Changes are merged to master locally, without pull requests, so master pushes must be tested too. Production
# deployments wait for these jobs (Vercel Deployment Checks), so the docs-versions workflow, whose pushes start no
# workflow, runs this one on master after committing.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # As Vercel builds: the docs sync (the pinned releases' docs, with its link check), MDX, Next's type check and
      # prerendering. It needs no configuration: the server validates its own when it starts (instrumentation.ts).
      - run: pnpm build

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      # Applies every migration to a fresh local database, then runs supabase/tests/database.
      - run: supabase db start
      - run: supabase test db
