name: test

# Changes are merged locally, without pull requests, so pushes to master and to staging (the sandbox, where changes
# are tried first) must be tested too. On those two branches the last job migrates the branch's Supabase project and
# deploys the commit to Vercel once every check has passed (deploy, below): Vercel's own Git deployments are off for
# them (vercel.json, git.deploymentEnabled), so a deployment never runs ahead of the schema it reads. The docs-versions
# workflow, whose pushes start no workflow, runs this one on master and staging after committing.
on:
  push:
    branches: [master, staging]
  pull_request:
  workflow_dispatch:

# A pull request's superseded run is cancelled; a push's never is, since cancelling the deploy job between the
# migration and the promotion would leave the database ahead of the deployment. Pushes to one branch run in turn.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag can be moved; a commit cannot. Dependabot keeps the pins and their version comments up to date.
      # Comments are dropped before the check, and a reference may be quoted or in a flow mapping ({ uses: ... }). A
      # local action (./) needs no pin; a Docker image needs its digest.
      - name: Check every action is pinned to a commit
        run: |
          q="[\"']?"
          pinned="(\./[^\"'[:space:],}]*|[^\"'[:space:],}@]+@[0-9a-f]{40}|docker://[^\"'[:space:],}@]+@sha256:[0-9a-f]{64})"
          if grep -rnE '[[:space:]{,-]uses:' .github/workflows | sed -E 's/^([^:]+:[0-9]+:)([^#]*)#.*$/\1\2/' |
            grep -E '[[:space:]{,-]uses:' | grep -vE "uses:[[:space:]]*${q}${pinned}${q}[[:space:]]*([,}].*)?$"; then
            echo "::error::Pin these actions to a full commit SHA, with the version in a comment (uses: owner/repo@<sha> # vX.Y.Z), and Docker images to a digest"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12 # a new actionlint release never changes a build
      # actionlint checks the scripts in workflows; this checks the ones in scripts/.
      - run: shellcheck -S warning scripts/*.sh

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # As Vercel builds: the docs sync (the pinned releases' docs, with its link check), MDX, Next's type check and
      # prerendering. It needs only the public configuration, which is compiled into the build and checked while the
      # pages prerender (src/lib/public-config.ts): stand-ins here. The server validates the rest when it starts.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_PADDLE_ENV: sandbox
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_ci
          NEXT_PUBLIC_PADDLE_PRICE_MONTHLY: pri_cimonth
          NEXT_PUBLIC_PADDLE_PRICE_YEARLY: pri_ciyear

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Generate the database types with this version locally too: another may write them differently.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      # Applies every migration to a fresh local database.
      - run: supabase db start
      # The committed types must describe that schema: regenerate them as `pnpm db:types` does, and fail on any
      # difference.
      - run: pnpm db:types
      - run: git diff --exit-code -- src/lib/supabase/database.types.ts
      # supabase/tests/database
      - run: supabase test db
      # Tests that need the local stack (its default password): supabase/local-tests
      - run: supabase test db supabase/local-tests
      # Each migration that moves data, against rows of the schema before it (supabase/migration-tests).
      - run: bash scripts/test-migrations.sh

  feed:
    name: Package feed end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      # The whole local stack: the feed needs Storage and Auth as well as the database.
      - run: supabase start
      # scripts/feed-e2e.sh: a real NuGet client publishing to and restoring from the feed, served by `next dev`.
      - name: Run the feed's end-to-end test
        run: |
          eval "$(supabase status -o env)"
          FEED_E2E_SUPABASE_URL="$API_URL" FEED_E2E_ANON_KEY="$ANON_KEY" FEED_E2E_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm test:feed-e2e

  deploy:
    name: Migrate the database, then deploy
    # master is production (tenantry.dev, the Supabase project tenantry); staging is the sandbox (sandbox.tenantry.dev,
    # the project tenantry-sandbox). The order is the cutover's (plans-and-investigations/LAUNCH-SETUP.md, §P): build
    # the deployment without making it live, apply the pending migrations and run the database tests against the
    # migrated project, then make the deployment live. The migrations drop tables the previous deployment reads, so
    # the previous deployment runs on the new schema only for the moment of the promotion, and the new deployment never
    # runs on the old schema. A failed migration leaves the built deployment unpromoted and the previous one live.
    # Vercel's Git integration does not deploy these branches (vercel.json); this job does, with the CLI.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, build, database, feed]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_GxhXa2sWWfguEzbj2nXnRvKO
      VERCEL_PROJECT_ID: prj_Apj9G8ovV17UlB9LEq1VuLwqJyyH
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The branch's project and its database password (Supabase → the project → Settings → Database).
      SUPABASE_PROJECT_REF: ${{ github.ref_name == 'master' && 'xoqqgenzhqefyeyzahim' || 'pfsuojxtufvpwygmgasc' }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'master' && secrets.SUPABASE_DB_PASSWORD_PRODUCTION || secrets.SUPABASE_DB_PASSWORD_SANDBOX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Check the settings this job needs
        run: |
          missing=''
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD_$([ "$GITHUB_REF_NAME" = master ] && echo PRODUCTION || echo SANDBOX)"
          if [ -n "$missing" ]; then
            echo "::error::Set the repository secret(s)$missing (README.md, Deploying) before pushing to $GITHUB_REF_NAME; nothing was deployed."
            exit 1
          fi
      # The same check as audit.yml, so a deployment waits for it as it waited for Vercel's deployment checks; it reads
      # the lockfile only.
      - run: pnpm audit --audit-level high
      - run: npm install --global vercel@65.9.0
      # The deployment is built from this checkout, with the branch's Vercel environment, and is not made live:
      # --skip-domain keeps the production domain on the previous deployment, and a preview deployment gets its branch
      # domain from the alias step below. The Git metadata is what a Git deployment would carry.
      - name: Build the deployment
        id: deployment
        run: |
          args=(--yes --token "$VERCEL_TOKEN" --meta "githubCommitSha=$GITHUB_SHA" --meta "githubCommitRef=$GITHUB_REF_NAME")
          if [ "$GITHUB_REF_NAME" = master ]; then
            args+=(--prod --skip-domain)
          fi
          url="$(vercel deploy "${args[@]}")"
          echo "Built $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Pending migrations are applied in order; a migration older than the newest applied one is refused (no
      # --include-all), as it would have been written against a schema the project has moved past. The pgTAP tests then
      # run against the migrated project, inside transactions they roll back.
      - name: Migrate the database
        run: |
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase test db --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Make the deployment live
        env:
          URL: ${{ steps.deployment.outputs.url }}
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            vercel promote "$URL" --yes --token "$VERCEL_TOKEN"
            curl --proto '=https' -fsS --retry 5 --retry-delay 5 -o /dev/null https://tenantry.dev/
          else
            vercel alias set "$URL" sandbox.tenantry.dev --token "$VERCEL_TOKEN"
          fi
