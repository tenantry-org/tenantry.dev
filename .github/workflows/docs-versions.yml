name: docs-versions

# Publishes each release on the site without anyone editing it: works out the docs versions from Core's and Pro's
# release tags (scripts/docs-versions-update.mjs), and what the site says about the newest release: the .NET versions
# and the samples. When either differs from docs-versions.json or newest-release.json, it commits both to master and
# staging, which redeploys the site. A new minor appears once both Core and Pro have released in it; a later patch in
# a minor updates it. A release whose docs lack their folder or
# changelog section is left out, with a warning. Scheduled hourly, but GitHub drops many scheduled runs, so a release
# can wait several hours for one; run it by hand (gh workflow run docs-versions.yml) to publish a release at once.
# The test workflow deploys the commit once its checks pass on it (its deploy job; README.md, Docs pipeline).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: docs-versions
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to run the test workflow on the new commit

jobs:
  update:
    name: Docs follow the releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # Every branch's history, to list the commits a reset of staging drops.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      # Plain Node and git; nothing is installed. A run that fails publishes nothing, and the next one tries again.
      - id: update
        run: node scripts/docs-versions-update.mjs update
      - name: Commit and deploy a change
        run: |
          # The test workflow deploys a commit once its checks pass on it (its deploy job, which also runs the audit),
          # and a push made with this token starts no workflow, so this job runs it on its own commits, on master and on
          # staging. If that failed last time, master's head is still this job's commit without that run, and it runs it
          # now. The sandbox follows production (staging is master): a run that pushed master but not staging is caught
          # up the same way, by a fast-forward only, so a change pushed to staging to try out is left alone.
          bot='41898282+github-actions[bot]@users.noreply.github.com'
          run_test_on() {
            for _ in 1 2 3; do
              gh workflow run test.yml --ref "$1" && return 0
              sleep 10
            done
            return 1
          }
          check_branch() {
            if [ "$(gh run list --workflow test.yml --branch "$1" --commit "$(git rev-parse HEAD)" --json databaseId --jq length)" = 0 ]; then
              run_test_on "$1" || return 1
            fi
          }
          check_master() {
            check_branch master
          }
          follow_master() {
            if git push origin HEAD:staging; then
              check_branch staging
            else
              echo "::warning::staging has commits master lacks; left as it is"
            fi
          }
          if git diff --quiet -- docs-versions.json newest-release.json; then
            echo "No change."
            if [ "$(git log -1 --format=%ae)" = "$bot" ]; then
              check_master
              follow_master
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          git commit -q -m 'Docs: publish the docs of the latest releases' -m "$(cat docs-versions.json)" -- docs-versions.json newest-release.json
          staging="$(git rev-parse origin/staging)"
          git push origin HEAD:master
          check_master
          # The sandbox follows production (staging is master), so staging is reset to master. Commits that only staging
          # has are dropped from it, and the warning lists them; they remain in the branch they were pushed from.
          dropped="$(git log --format='%h %s' "HEAD..$staging")"
          git push --force-with-lease="staging:$staging" origin HEAD:staging
          check_branch staging
          if [ -n "$dropped" ]; then
            dropped="${dropped//%/%25}"
            echo "::warning::staging reset to master, dropping the commits master lacks:%0A${dropped//$'\n'/%0A}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Last, so what could be published is committed first: a release left out (its docs folder, changelog section or
      # facts are missing) fails the run, which notifies, with the reasons in the run's summary.
      - name: Fail when a release was left out
        if: always() && steps.update.outputs.left_out != '' && steps.update.outputs.left_out != '0'
        env:
          LEFT_OUT: ${{ steps.update.outputs.left_out }}
        run: |
          echo "::error::$LEFT_OUT release(s) left out; the run's summary gives the reasons."
          exit 1
