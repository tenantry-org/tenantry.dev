# SonarCloud automatic analysis. Tests and the fakes they share (src/utils/testing) are test code, analysed
# with the test rules rather than as production code.
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/utils/testing/**,supabase/tests/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/utils/testing/**,supabase/tests/**
