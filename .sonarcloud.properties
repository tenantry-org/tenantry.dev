# SonarCloud automatic analysis. Tests and the fakes they share (src/test) are test code, analysed
# with the test rules rather than as production code. The database types are generated (pnpm db:types), so they
# are not analysed at all.
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,supabase/tests/**,src/lib/supabase/database.types.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test/**,supabase/tests/**
